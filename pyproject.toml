[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904", "UP017", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]
